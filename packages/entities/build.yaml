image: "macaronios/terragon-minimal:latest-amd64"
steps:
- >-
  anise repo update &&
  anise upgrade -y &&
  anise i --sync-repos utils/jq utils/yq -y &&
  anise cleanup &&
  mkdir /{{ .Values.name }}/usr/share/macaroni/entities -p &&
  TARGET_DIR=/{{ .Values.name }}/usr/share/macaroni/entities/
  bash scripts/generator.sh
package_dir: /{{ .Values.name }}
